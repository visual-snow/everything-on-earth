resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name localhost;

    # Portal landing page
    location / {
        root /usr/share/nginx/portal;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Triage Trainer (static files served directly)
    location /triage/ {
        alias /usr/share/nginx/triage/;
        index index.html;
        try_files $uri $uri/ /triage/index.html;
    }

    # MedAgentSim (reverse proxy - fails gracefully if not running)
    location /sim/ {
        set $medagentsim_upstream http://medagentsim:8000;
        proxy_pass $medagentsim_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 5s;

        error_page 502 503 504 = @sim_unavailable;
    }

    location @sim_unavailable {
        default_type text/html;
        return 503 '<!DOCTYPE html><html><head><title>Hospital Simulation</title><style>body{background:#0f1117;color:#e2e8f0;font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}h1{font-size:1.5rem}p{color:#94a3b8;margin-top:1rem}.back{margin-top:2rem;display:inline-block;color:#4f8cff;text-decoration:none}</style></head><body><div><h1>Hospital Simulation</h1><p>MedAgentSim is not running yet.<br>Start it with: docker compose up -d medagentsim</p><a class="back" href="/">Back to Portal</a></div></body></html>';
    }

    # 3D Anatomy Viewer (static files)
    location /anatomy/ {
        alias /usr/share/nginx/anatomy/;
        index index.html;
    }
}
