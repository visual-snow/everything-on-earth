<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Everything on Earth{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
{% block head %}{% endblock %}
<style>
  :root {
    --bg-deep: #0d0d0d;
    --bg-base: #0d1117;
    --bg-surface: #161b22;
    --bg-elevated: #21262d;
    --border: #30363d;
    --text-primary: #e5e2e1;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --score-high: #3fb950;
    --score-mid: #d29922;
    --score-low: #484f58;
    --destructive: #f85149;
    --font-heading: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--bg-base);
    color: var(--text-primary);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Sidebar layout */
  .page-layout {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr);
    min-height: 100dvh;
  }
  .sidebar {
    background: var(--bg-surface);
    border-right: 1px solid var(--border);
    padding: 1.5rem 1rem;
    overflow-y: auto;
    position: sticky;
    top: 0;
    height: 100dvh;
  }

  /* Breadcrumb */
  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }
  .breadcrumb a { color: var(--text-muted); }
  .breadcrumb a:hover { color: var(--accent); }
  .breadcrumb .sep { opacity: 0.5; }
  .breadcrumb .current { color: var(--text-primary); }

  /* Search */
  .search-input {
    width: 100%;
    background: var(--bg-base);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 0.5rem 0.75rem;
    border-radius: 6px;
    font-size: 0.85rem;
    font-family: var(--font-body);
    margin-bottom: 1.25rem;
  }
  .search-input:focus { border-color: var(--accent); outline: none; }
  .search-input::placeholder { color: var(--text-muted); }

  /* Pills & badges */
  .pill {
    display: inline-flex;
    align-items: center;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    font-size: 0.75rem;
    background: var(--bg-elevated);
    color: var(--text-muted);
  }
  .pill.tag { background: #1f3a5f; color: var(--accent); }
  .score-badge {
    display: inline-flex;
    align-items: center;
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
    font-weight: 600;
    font-size: 0.85rem;
  }
  .score-high { color: var(--score-high); background: rgba(63,185,80,0.1); }
  .score-mid { color: var(--score-mid); background: rgba(210,153,34,0.1); }
  .score-low { color: var(--score-low); background: rgba(72,79,88,0.15); }

  /* Buttons */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    font-size: 0.85rem;
    font-family: var(--font-body);
    font-weight: 500;
    border: 1px solid var(--border);
    background: var(--bg-surface);
    color: var(--text-primary);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    text-decoration: none;
  }
  .btn:hover { border-color: var(--accent); background: var(--bg-elevated); text-decoration: none; }
  .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover { background: #4c9aed; }

  /* Sidebar sections */
  .sidebar-section { margin-bottom: 1.25rem; }
  .sidebar-section h3 {
    font-family: var(--font-heading);
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.5rem;
  }
  .sidebar-list { list-style: none; }
  .sidebar-list li {
    padding: 0.35rem 0.5rem;
    border-radius: 4px;
    font-size: 0.8rem;
    color: var(--text-muted);
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sidebar-list li:hover { background: var(--bg-base); color: var(--text-primary); }
  .sidebar-list li.active { background: var(--bg-base); color: var(--accent); }
  .sidebar-list .count { font-size: 0.7rem; opacity: 0.6; }
  .sidebar-stats {
    font-size: 0.8rem;
    color: var(--text-muted);
    padding-top: 0.75rem;
    border-top: 1px solid var(--border);
  }

  /* Responsive */
  @media (max-width: 768px) {
    .page-layout { grid-template-columns: 1fr; }
    .sidebar {
      position: relative;
      height: auto;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
  }
</style>
</head>
<body>
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
