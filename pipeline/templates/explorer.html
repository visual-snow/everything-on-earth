<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }} — Explorer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    padding: 2rem;
  }
  .page {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr);
    gap: 1.5rem;
    align-items: start;
  }
  .sidebar {
    position: sticky;
    top: 2rem;
    background: #11161d;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 1rem;
    max-height: calc(100vh - 4rem);
    overflow-y: auto;
  }
  .sidebar-eyebrow {
    color: #58a6ff;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 0.72rem;
    margin-bottom: 0.4rem;
  }
  .sidebar h2 {
    font-size: 1.05rem;
    margin-bottom: 0.35rem;
  }
  .sidebar-copy {
    color: #8b949e;
    font-size: 0.84rem;
    line-height: 1.45;
    margin-bottom: 1rem;
  }
  .sidebar-section-label {
    color: #8b949e;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 0.8rem 0 0.4rem;
  }
  .domain-sidebar {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  .sidebar-domain-button {
    width: 100%;
    border: 1px solid #30363d;
    background: #161b22;
    color: #c9d1d9;
    border-radius: 10px;
    padding: 0.6rem 0.8rem;
    display: flex;
    justify-content: space-between;
    gap: 0.75rem;
    align-items: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, transform 0.1s;
    text-align: left;
    font-size: 0.88rem;
  }
  .sidebar-domain-button:hover {
    border-color: hsl(var(--domain-hue, 210), 72%, 68%);
    transform: translateY(-1px);
  }
  .sidebar-domain-button.active {
    border-color: hsl(var(--domain-hue, 210), 72%, 68%);
    background: hsla(var(--domain-hue, 210), 55%, 18%, 0.95);
  }
  .sidebar-domain-label {
    text-transform: capitalize;
    font-size: 0.88rem;
    line-height: 1.2;
  }
  .sidebar-domain-count {
    background: rgba(255, 255, 255, 0.08);
    color: #8b949e;
    border-radius: 999px;
    padding: 0.15rem 0.55rem;
    font-size: 0.75rem;
    white-space: nowrap;
  }
  .sub-domain-list {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .sub-domain-button {
    width: 100%;
    border: 1px solid transparent;
    background: transparent;
    color: #8b949e;
    border-radius: 6px;
    padding: 0.35rem 0.65rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.15s;
    text-align: left;
  }
  .sub-domain-button:hover { color: #c9d1d9; background: rgba(255,255,255,0.04); }
  .sub-domain-button.active { color: #58a6ff; background: rgba(88,166,255,0.08); border-color: rgba(88,166,255,0.2); }
  .main-panel { min-width: 0; }
  h1 { color: #58a6ff; margin-bottom: 0.5rem; font-size: 1.6rem; }
  .stats { color: #8b949e; margin-bottom: 1.5rem; }
  .controls { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .domain-type-mobile { display: none; }
  input, select {
    background: #161b22;
    border: 1px solid #30363d;
    color: #c9d1d9;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    font-size: 0.9rem;
  }
  input:focus, select:focus { border-color: #58a6ff; outline: none; }
  input[type="text"] { min-width: 300px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1rem; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.25rem; transition: border-color 0.2s; }
  .card:hover { border-color: #58a6ff; }
  .card h3 { color: #58a6ff; font-size: 1rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .card h3 a { color: inherit; text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; }
  .card p { color: #8b949e; font-size: 0.85rem; line-height: 1.4; margin-bottom: 0.75rem; }
  .meta { display: flex; gap: 0.75rem; flex-wrap: wrap; font-size: 0.8rem; color: #8b949e; }
  .meta span { background: #21262d; padding: 0.15rem 0.5rem; border-radius: 4px; }
  .score { color: #3fb950; font-weight: 600; }
  .tag { background: #1f3a5f; color: #58a6ff; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.75rem; }
  .catalog-badge { padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; }
  .domain-badge { padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; opacity: 0.8; }
  .count { color: #8b949e; margin-bottom: 1rem; }
  .hidden { display: none; }

  @media (max-width: 980px) {
    body { padding: 1rem; }
    .page { grid-template-columns: 1fr; }
    .sidebar { position: static; max-height: none; }
    .domain-sidebar {
      flex-direction: row;
      overflow-x: auto;
      padding-bottom: 0.2rem;
    }
    .sidebar-domain-button {
      min-width: max-content;
      width: auto;
    }
    .sub-domain-list { flex-direction: row; overflow-x: auto; }
    .sub-domain-button { min-width: max-content; width: auto; }
    .domain-type-mobile { display: block; }
    input[type="text"] { min-width: 0; width: 100%; }
  }
</style>
</head>
<body>
<div class="page">
  <aside class="sidebar">
    <p class="sidebar-eyebrow">Everything on Earth</p>
    <h2>Explorer</h2>
    <p class="sidebar-copy">{{ total }} open-source tools across {{ catalog_count }} domains. Pick a domain to drill down.</p>
    <p class="sidebar-section-label">Domains</p>
    <div class="domain-sidebar" id="catalog-sidebar"></div>
    <div id="sub-domain-section" class="hidden">
      <p class="sidebar-section-label">Sub-domains</p>
      <div class="sub-domain-list" id="sub-domain-sidebar"></div>
    </div>
  </aside>

  <main class="main-panel">
    <h1 id="heading">{{ title }}</h1>
    <p class="stats" id="stats">{{ total }} repos across {{ catalog_count }} domains</p>

    <div class="controls">
      <input type="text" id="search" placeholder="Filter by name, description, or tag...">
      <div class="domain-type-mobile">
        <select id="catalog-filter-mobile">
          <option value="">All domains</option>
        </select>
      </div>
      <select id="sort-by">
        <option value="score">Sort by quality score</option>
        <option value="stars">Sort by stars</option>
        <option value="activity">Sort by activity</option>
        <option value="name">Sort by name</option>
      </select>
    </div>

    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
  </main>
</div>

<script>
const CATALOG = {{ catalog_json }};
const TOTAL = CATALOG.length;

function domainHue(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return Math.abs(hash) % 360;
}

// State
let activeCatalog = '';
let activeSubDomain = '';

// Build catalog domain index
const catalogDomains = [...new Set(CATALOG.map(e => e._catalog))].sort();
const catalogCounts = {};
catalogDomains.forEach(c => { catalogCounts[c] = CATALOG.filter(e => e._catalog === c).length; });

// Mobile select
const mobileSelect = document.getElementById('catalog-filter-mobile');
catalogDomains.forEach(c => {
  const opt = document.createElement('option');
  opt.value = c;
  opt.textContent = c.replace(/-/g, ' ');
  mobileSelect.appendChild(opt);
});

function getSubDomains(catalogSlug) {
  const entries = catalogSlug ? CATALOG.filter(e => e._catalog === catalogSlug) : CATALOG;
  const counts = {};
  entries.forEach(e => {
    const domains = e.found_in_domains || [e.sub_domain];
    domains.forEach(d => { if (d) counts[d] = (counts[d] || 0) + 1; });
  });
  return Object.entries(counts).sort((a, b) => b[1] - a[1]);
}

function renderCatalogSidebar() {
  const sidebar = document.getElementById('catalog-sidebar');
  const items = [{ value: '', label: 'All domains', count: TOTAL }]
    .concat(catalogDomains.map(c => ({ value: c, label: c.replace(/-/g, ' '), count: catalogCounts[c] })));

  sidebar.innerHTML = items.map(item => {
    const hue = item.value ? domainHue(item.value) : 210;
    const cls = item.value === activeCatalog ? 'active' : '';
    return `<button type="button" class="sidebar-domain-button ${cls}" data-catalog="${item.value}" style="--domain-hue:${hue}">
      <span class="sidebar-domain-label">${item.label}</span>
      <span class="sidebar-domain-count">${item.count}</span>
    </button>`;
  }).join('');

  sidebar.querySelectorAll('.sidebar-domain-button').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCatalog = btn.dataset.catalog;
      activeSubDomain = '';
      mobileSelect.value = activeCatalog;
      applyFilters();
    });
  });
}

function renderSubDomainSidebar() {
  const section = document.getElementById('sub-domain-section');
  const sidebar = document.getElementById('sub-domain-sidebar');

  if (!activeCatalog) {
    section.classList.add('hidden');
    return;
  }

  const subs = getSubDomains(activeCatalog);
  if (subs.length === 0) {
    section.classList.add('hidden');
    return;
  }

  section.classList.remove('hidden');
  const items = [{ value: '', label: 'All sub-domains', count: catalogCounts[activeCatalog] }]
    .concat(subs.map(([name, count]) => ({ value: name, label: name, count })));

  sidebar.innerHTML = items.map(item => {
    const cls = item.value === activeSubDomain ? 'active' : '';
    return `<button type="button" class="sub-domain-button ${cls}" data-sub="${item.value}">
      <span>${item.label}</span>
      <span class="sidebar-domain-count">${item.count}</span>
    </button>`;
  }).join('');

  sidebar.querySelectorAll('.sub-domain-button').forEach(btn => {
    btn.addEventListener('click', () => {
      activeSubDomain = btn.dataset.sub;
      applyFilters();
    });
  });
}

function render(entries) {
  const grid = document.getElementById('grid');
  grid.innerHTML = entries.map(e => {
    const catHue = domainHue(e._catalog || 'unknown');
    const catBg = `hsla(${catHue}, 60%, 25%, 0.8)`;
    const catColor = `hsl(${catHue}, 80%, 75%)`;
    const domHue = domainHue(e.domain || e.sub_domain || 'unknown');
    const domBg = `hsla(${domHue}, 45%, 20%, 0.6)`;
    const domColor = `hsl(${domHue}, 60%, 70%)`;
    const detailHref = `catalog/${e._catalog}/detail/${e.slug}.html`;
    return `
    <div class="card">
      <h3>
        <a href="${detailHref}">${e.name}</a>
        <span class="catalog-badge" style="background:${catBg};color:${catColor}">${(e._catalog || '').replace(/-/g, ' ')}</span>
        ${e.domain || e.sub_domain ? `<span class="domain-badge" style="background:${domBg};color:${domColor}">${e.domain || e.sub_domain}</span>` : ''}
      </h3>
      <p>${e.summary || e.description || ''}</p>
      <div class="meta">
        <span class="score" style="color: ${(e.quality_score ?? e.score ?? 0) >= 70 ? '#3fb950' : (e.quality_score ?? e.score ?? 0) >= 40 ? '#d29922' : '#8b949e'}">${e.quality_score ?? e.score ?? '—'}</span>
        ${e.stars ? `<span>\u2605 ${e.stars.toLocaleString()}</span>` : ''}
        ${e.language ? `<span>${e.language}</span>` : ''}
        ${e.license ? `<span>${e.license}</span>` : ''}
      </div>
      ${(e.tags || []).length ? `<div class="meta" style="margin-top:0.5rem">${e.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : ''}
    </div>`;
  }).join('');
  document.getElementById('count').textContent = `Showing ${entries.length} of ${TOTAL}`;
}

function applyFilters() {
  let filtered = [...CATALOG];
  const q = document.getElementById('search').value.toLowerCase();
  const sort = document.getElementById('sort-by').value;

  if (activeCatalog) filtered = filtered.filter(e => e._catalog === activeCatalog);
  if (activeSubDomain) filtered = filtered.filter(e =>
    (e.found_in_domains || [e.sub_domain]).includes(activeSubDomain)
  );
  if (q) filtered = filtered.filter(e =>
    e.name.toLowerCase().includes(q) ||
    (e.description || '').toLowerCase().includes(q) ||
    (e.summary || '').toLowerCase().includes(q) ||
    (e.tags || []).some(t => t.toLowerCase().includes(q))
  );

  if (sort === 'score') filtered.sort((a, b) => (b.quality_score ?? b.score ?? 0) - (a.quality_score ?? a.score ?? 0));
  else if (sort === 'stars') filtered.sort((a, b) => (b.stars || 0) - (a.stars || 0));
  else if (sort === 'activity') filtered.sort((a, b) => (b.last_activity || '').localeCompare(a.last_activity || ''));
  else if (sort === 'name') filtered.sort((a, b) => a.name.localeCompare(b.name));

  // Update heading
  const heading = document.getElementById('heading');
  const stats = document.getElementById('stats');
  if (activeCatalog) {
    const label = activeCatalog.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    heading.textContent = label;
    stats.textContent = `${catalogCounts[activeCatalog]} repos`;
  } else {
    heading.textContent = '{{ title }}';
    stats.textContent = `${TOTAL} repos across ${catalogDomains.length} domains`;
  }

  renderCatalogSidebar();
  renderSubDomainSidebar();
  render(filtered);
}

document.getElementById('search').addEventListener('input', applyFilters);
mobileSelect.addEventListener('change', () => { activeCatalog = mobileSelect.value; activeSubDomain = ''; applyFilters(); });
document.getElementById('sort-by').addEventListener('change', applyFilters);
applyFilters();
</script>
</body>
</html>
